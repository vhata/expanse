# Project lint and format settings. Kept explicit so local runs and CI agree
# regardless of any user-level ruff configuration.
line-length = 100
# Python only: ruff would otherwise also format Python blocks inside Markdown,
# including the vendored docket/ directory.
include = ["*.py", "*.pyi"]
extend-exclude = ["docket"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
